<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1" cellspacing="5" cellpadding="10">

        <caption>Product List</caption>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Milk</td>
                <td>1.5 EUR</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Cheese</td>
                <td>2.5 EUR</td>
                <td>1</td>
            </tr>
        </tbody>

        <tfoot>
            <td>Total</td>
            <td>100</td>
            <td>4</td>
        </tfoot>
    </table>
</body>
</html>
