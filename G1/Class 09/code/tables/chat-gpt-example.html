
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HTML Table Example</title>
</head>
<body>

    <h1>Product List</h1>

    <table border="1">

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>
            <tr>
                <td>Laptop</td>
                <td>800 EUR</td>
                <td>2</td>
            </tr>

            <tr>
                <td>Mouse</td>
                <td>20 EUR</td>
                <td>5</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td>Total</td>
                <td>820 EUR</td>
                <td>7</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
