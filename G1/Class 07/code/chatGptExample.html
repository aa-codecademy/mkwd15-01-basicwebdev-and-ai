
<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5 -->

<html lang="en">
<!-- The root element. All HTML elements go inside it.
     lang="en" tells the browser that the page is in English. -->

<head>
    <!-- Contains information ABOUT the page, not the visible page content -->

    <meta charset="UTF-8">
    <!-- Defines the character encoding so letters and symbols display correctly -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page display properly on different screen sizes -->

    <title>My First HTML Page</title>
    <!-- Defines the title shown in the browser tab -->

</head>

<body>
    <!-- Contains everything that the user can see on the webpage -->

    <h1>Welcome to My Website!</h1>
    <!-- Main heading. h1 is the largest heading level -->

    <h2>About Me</h2>
    <!-- A smaller heading used for a section -->

    <p>Hello! My name is Alex and I am learning HTML.</p>
    <!-- Paragraph element used to display text -->

    <p>I enjoy learning new things and building websites.</p>
    <!-- Another paragraph -->

    <h2>My Hobbies</h2>

    <ul>
        <!-- Unordered list. Displays items with bullet points -->

        <li>Reading books</li>
        <!-- One item in the list -->

        <li>Playing football</li>
        <li>Traveling</li>
    </ul>

    <h2>My Favorite Website</h2>

    <a href="https://www.google.com">
        Visit Google
    </a>
    <!-- Anchor element. Creates a clickable link.
         The href attribute defines where the link goes -->

    <h2>My Favorite Image</h2>

    <img src="https://placehold.co/300x150"
         alt="A sample placeholder image">
    <!-- Displays an image.
         src defines the image location.
         alt describes the image if it cannot be displayed -->

    <hr>
    <!-- Adds a horizontal line to separate content -->

    <p>Thank you for visiting my website!</p>

</body>
</html>
